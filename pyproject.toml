[project]
name = "longrun"
dynamic = ["version"]
description = "Long-Horizon Outcome Harness: explicit, bounded, independently verified autonomous runs for Claude Code, Codex, and OpenCode"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
longrun = "longrun.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["longrun*"]

[tool.setuptools.package-data]
longrun = ["knowledge/*.md", "knowledge/**/*.md", "adapters/*.json", "schemas/*.json"]

[tool.setuptools.dynamic]
version = {attr = "longrun.__version__"}
